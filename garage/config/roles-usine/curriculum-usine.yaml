# Unified-loop CURRICULUM AGENT for the usine production-line RSI.
#
# Same seat contract as the stock practice curriculum: this Agent owns only
# the high-level lifecycle decisions (WAVE / SATURATED / STALLED) and authors
# each wave's projects. fuyao-work holds the pen; fuyao-coding is the delegated
# eye for every Look (text-primary chair, native-sighted reader). This is a
# distinct, persistent Agent context from every other seat; sharing a model
# never shares private conversation, scratch, candidate access, or authority.
model: fuyao-work
provider_order: []
provider_allow_fallbacks: true
provider_require_parameters: false
vision_model: fuyao-coding
vision_rounds: 1
look_ensemble: 1
look_ensemble_temp: 0.8
split_done_gate: true
max_tokens: 65536
# "max" is the measured faster arm on this gateway, not a guess.  A/B'd
# 2026-10-19 with probe_curriculum_effort.py on the recorded first
# wave-authoring call (5172 prompt tokens, same bytes both arms):
# max answered in 51s, medium in 108s — medium burned 16695 completion
# tokens to return LESS text (2896 chars) than max's 8225 tokens / 5625
# chars.  So "lower effort is cheaper" is false here; do not retune this
# knob from intuition.  Re-run the probe before changing it.
#
# Caveat that outranks all of the above: first-response latency at the SAME
# effort has been observed at 51s, 108s, 138.7s, 322s and >300s across runs.
# The guard that matters is the run ceiling (now 1500s, see
# time_budget.DEFAULT_RUN_CEILING_SECS) plus per-seat wall_clock_secs
# slices (see time_budget.DEFAULT_SLICES) — not this line.
reasoning_effort: "max"
reasoning_max_tokens: 0
reasoning_in_history: true
temperature: 0.0
primary_temperature: 1.0
top_p: 1.0
agent_decided_stop: true
# Budgets are EMERGENCY WATCHDOGS, not semantic stopping criteria (paper
# RSIAgent 2.1: the Curriculum selects what to explore, it does not decide
# when a run is over — verification does that).  2026-10-19: these were
# 2000 iters / 86400s, i.e. a full day per wave, which is why the two recorded
# waves each burned ~40 minutes before an infrastructure failure surfaced.
# Tightened to the Curriculum slice of the 600s run ceiling (see
# time_budget.DEFAULT_SLICES and run_usine's --run-ceiling-secs): a wave must
# be able to finish, and be cheap to rerun.
#
# 180s, not less: the first run under this budget (bfs-20261019) measured a
# 121s gateway round trip (APITimeoutError + retry) and died at
# `safety_ceiling` before the model had answered once. A slice that cannot
# cover one worst-case round trip is not a budget, it is a guaranteed abort.
max_iters: 60
max_nudges: 25
# 400s, not less: bfs8 measured the full authoring arc — one worst-case
# first response (71s this run; 322s on record) plus 3-5 rounds at 15-75s
# each.  The kill vector was NOT the arc: it was 128k-token contexts (a
# recon program dumped 153k chars into history) pushing rounds 5-6 into the
# gateway's slow tail, where two 120s SDK timeouts per call burned 480s of
# the slice.  With ctx_high_water at 250k chars the fold fires long before
# that regime, and the slice covers the arc with room for one timed-out
# call.  400s >= 322s (worst first response) + 2x40s (tail rounds).
# Measured: bfs10 published a 6-project wave in 204s of seat time; the slice
# is sized for the worst first response, not for a wide wave.
wall_clock_secs: 280
history_keep_pairs: 80
keep_chars: 500000
verifier_model: ""
ctx_high_water: 250000
ctx_low_water: 150000
doubts_block_pass: true
look_max_side: 2560
archive_eyes: false
vision_model_2: ""
vision_max_tokens: 32768
practice_mode: true
independent_verify: false
escalation_model: ""
max_resumes: 0
action_discipline: true
cycle_evidence: true
system_extra: |
  USINE PRODUCTION-LINE CONTEXT (governs every wave you author):
  - OUTPUT BUDGET: each of your programs must print LESS THAN 8000 characters.
    Never cat a whole file or dump a full tree into stdout — the transcript
    rides your context forever, and a program that prints 150k characters
    pushed this seat's prompt to 128k tokens in one recorded run, where every
    later call crawled. List file NAMES with sizes, then read only the one
  file you actually need, in slices (sed -n '1,80p'). Recon is done in ONE
  program; after it you author.
  - AUTHOR BY ITERATION 4. Measured 2026-10-19 (bfs9): seven recon rounds
    into tools.ts/discipline.ts/parity suites and the slice died at the
    safety ceiling BEFORE the publish program was ever written — the seat
    knows the tool surface from the menu already, and every extra read
    round-trip costs 4-90s of gateway time. Your instruction text does not
    need line-level quotes from the sources; it needs the RIGHT FILE NAMES
    and the RIGHT INVARIANT NAMES. One recon program (round 1-2), at most
    ONE follow-up read (round 3), then WRITE the wave. A reply with no JSON
    action burns a whole round-trip — every non-PLAN turn must carry either
    a program or the publish action.
  - WAVE SHAPE: publish AT MOST 1 project in this wave, and make it the
    SIMPLEST possible change: ONE source file plus ONE test, in menu target
    A, B or C ONLY (the dsh-plugin tool surface and its pinning suite —
    text-only TypeScript, no render path, no ffmpeg, no browser).
    Prefer a change to WORDING, MESSAGES, NAMING or DOCUMENTATION over a
    change to validation logic, schemas or control flow: the Actor seat
    implements it, and a message-shaped edit lands in one program while a
    schema edit needs a long reasoning chain (measured 2026-10-19: the
    schema-hardening project needed 9-12k reasoning tokens per call and the
    message-shaped one needed a fraction of that).
    Measured 2026-10-19 (bfs10): a 6-project wave at 2-way parallelism needs
    3 rounds of Actor seats (3 x 700s) and cannot fit any run ceiling; and
    wide projects never reach a green gate inside one Actor slice.  A narrow
    wave with one small project is what the budget can actually carry to a
    merge.
  - Author from the TARGET MENU below. Do NOT sweep the repository first:
    measured 2026-10-19 (bfs5): an unrestricted Curriculum reached iteration
    14 with a 74k token context and never published a wave; measured again
    (bfs9): seven recon rounds died at the ceiling before authoring. Pick a
    target, read THAT file once, and author.
  - After you stage a project's fixture tree, the harness extracts a
    committed snapshot of a real multilingual video production-line
    repository OVER your staged files, and the repository's copy wins any
    collision: a staged copy of an existing file would be replaced by the
    repository's own bytes. Stage only the task-specific fixtures your
    instruction needs (sample inputs, blank workspaces); never try to
    reconstruct the codebase - it is already on the Actor's machine.
  - The Actor therefore starts from the real repository plus your fixtures
  at /home/user/evolution_project. Author instructions that treat the
  existing code as the working material.
  - Every candidate must keep the repository's offline verification gate
    green: "pnpm verify" (from the project root, after a one-time "pnpm
    install") must exit 0. Tell the Actor in each instruction to run that
    gate as its own final check before declaring done.
  - Live platform publishing and platform login never run in this
    environment: instructions must ask for offline artifacts only (code,
    data, fixtures, reports), never for a live publish or login.
  - Improvements may target the pipeline itself or the repository's
    AI-operator tool surface (the dsh plugin package, plus the howtos
    under skills/ that teach it): tool naming, request shapes, refusal
    and approval wording, discipline defaults, and the suites that pin
    them are all ordinary tracked sources. An instruction may name
    those files as the working material and ask for offline-verifiable
    edits there; it must also demand the guard rails stay intact -
    approval-gated tools keep failing closed when approval is absent,
    publishing stays out of reach by default, and red-line suites may
    be extended but never relaxed.

  TARGET MENU (measured sizes; read only what you name):
  A. packages/dsh-plugin/src/tools.ts (28 KB) - the 18-tool agent surface:
     one tool per pipeline capability. Naming, argument shapes, error text.
  B. packages/dsh-plugin/src/index.ts (4.5 KB) + discipline.ts (2.3 KB) -
     the red-line carriers: approval fail-closed, publish unreachable by
     default, the system-prompt discipline section.
  C. packages/dsh-plugin/test/plugin-parity.test.ts (12 KB) - the pinning
     suite that keeps A and B honest. Extending it is a valid project.
  D. packages/dsh-plugin/test/plugin.test.ts (19 KB) - behavioural tests
     for the built dist bundle.
  E. skills/<name>/SKILL.md (11 skills, e.g. video-generation, publish-copy,
     bgm-bed) - the operator howtos that teach the same surface.
  F. packages/core/src (39 files, 456 KB) - the real pipeline. EXPENSIVE:
     name one module (scene parsing, timeline math, audio composition,
     manifest building) and read only that.
  Guard rails for every target: approval-gated tools keep failing closed,
  publish stays unreachable unless config.publish === true, red-line suites
  may be extended but never relaxed.
