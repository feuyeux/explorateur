# Unified-loop CURRICULUM AGENT for the usine production-line RSI.
#
# Same seat contract as the stock practice curriculum: this Agent owns only
# the high-level lifecycle decisions (WAVE / SATURATED / STALLED) and authors
# each wave's projects. fuyao-work holds the pen; fuyao-coding is the delegated
# eye for every Look (text-primary chair, native-sighted reader). This is a
# distinct, persistent Agent context from every other seat; sharing a model
# never shares private conversation, scratch, candidate access, or authority.
model: fuyao-work
provider_order: []
provider_allow_fallbacks: true
provider_require_parameters: false
vision_model: fuyao-coding
vision_rounds: 1
look_ensemble: 1
look_ensemble_temp: 0.8
split_done_gate: true
max_tokens: 65536
# "max" was the measured faster arm on this gateway — **on 2026-10-19**.  A/B'd
# with probe_curriculum_effort.py on the recorded first wave-authoring call
# (5172 prompt tokens, same bytes both arms): max answered in 51s, medium in
# 108s — medium burned 16695 completion tokens to return LESS text (2896 chars)
# than max's 8225 tokens / 5625 chars.  So "lower effort is cheaper" is false
# here; do not retune this knob from intuition.  Re-run the probe before
# changing it.
#
# **2026-10-21: the ladder inverted, so this line moved to "low".**  Same probe,
# same bytes (the CURRENT curriculum brief: 24067-char system + 8412-char user):
#   low → answered in 7.2s (prompt 7411 / completion 1883, answer 7471 chars,
#          and the answer names the right target: "target G, D1 primary +
#          D2–D5 fix direction")
#   max → **no answer within 200s** (TimeoutError)
# The live wave foodnames-video2 was on "max" and burned ~19 minutes of
# APITimeoutError retries without the seat answering ONCE.  Same gateway, same
# model, same request — only the effort knob differs.  "max" is not "better
# thinking" here, it is the tier that no longer answers.
#
# The guard that matters is the run ceiling (now 2050s, see
# time_budget.DEFAULT_RUN_CEILING_SECS) plus per-seat wall_clock_secs slices
# (now 400s for the curriculum seat — see time_budget.DEFAULT_SLICES) — not
# this line.
reasoning_effort: "low"
reasoning_max_tokens: 0
reasoning_in_history: true
temperature: 0.0
primary_temperature: 1.0
top_p: 1.0
agent_decided_stop: true
# Budgets are EMERGENCY WATCHDOGS, not semantic stopping criteria (paper
# RSIAgent 2.1: the Curriculum selects what to explore, it does not decide
# when a run is over — verification does that).  2026-10-19: these were
# 2000 iters / 86400s, i.e. a full day per wave, which is why the two recorded
# waves each burned ~40 minutes before an infrastructure failure surfaced.
# Tightened to the Curriculum slice of the 600s run ceiling (see
# time_budget.DEFAULT_SLICES and run_usine's --run-ceiling-secs): a wave must
# be able to finish, and be cheap to rerun.
#
# 180s, not less: the first run under this budget (bfs-20261019) measured a
# 121s gateway round trip (APITimeoutError + retry) and died at
# `safety_ceiling` before the model had answered once. A slice that cannot
# cover one worst-case round trip is not a budget, it is a guaranteed abort.
# (2026-10-21: the slice is now 400s — see time_budget.DEFAULT_SLICES.  The
# sentence above still stands: the slice must cover one worst-case round trip,
# and 2026-10-21 measured one at 200s+ on the "max" tier.)
max_iters: 60
max_nudges: 25
# 400s, not less: bfs8 measured the full authoring arc — one worst-case
# first response (71s this run; 322s on record) plus 3-5 rounds at 15-75s
# each.  The kill vector was NOT the arc: it was 128k-token contexts (a
# recon program dumped 153k chars into history) pushing rounds 5-6 into the
# gateway's slow tail, where two 120s SDK timeouts per call burned 480s of
# the slice.  With ctx_high_water at 250k chars the fold fires long before
# that regime.  Measured: bfs10 published a 6-project wave in 204s of seat
# time; the slice is sized for the worst first response, not for a wide wave.
#
# 2026-10-20: this value was 280s and the DRS (Phase 2) could not use its
# own 400s slice, because a slice is a CEILING and never loosens a seat's
# own declared wall — the seat silently ran on 280s and lost the DRS
# curriculum to a 344s timed-out first response (the gateway's tail reaches
# 322s at the same effort, and a stalled request IS charged to the seat's
# time limit).  400s >= 322s (worst first response) + 2x40s (tail rounds).
# Phase 1 is now 400s too (2026-10-21 measured: the foodnames-video wave lost
# the curriculum seat on the old 280s slice — first response 207s + a second
# round 74s, and not a single project was authored; the seat's own history has
# a p50 of 211.5s. A slice shorter than the median single response is not a
# budget, it is a coin flip).  The seat's declared 400s and the Phase-1 slice
# are now the same number, so apply_slices no longer clamps it down.
wall_clock_secs: 400
history_keep_pairs: 80
keep_chars: 500000
verifier_model: ""
ctx_high_water: 250000
ctx_low_water: 150000
doubts_block_pass: true
look_max_side: 2560
archive_eyes: false
vision_model_2: ""
vision_max_tokens: 32768
practice_mode: true
independent_verify: false
escalation_model: ""
max_resumes: 0
action_discipline: true
cycle_evidence: true
system_extra: |
  USINE PRODUCTION-LINE CONTEXT (governs every wave you author):
  - OUTPUT BUDGET: each of your programs must print LESS THAN 8000 characters.
    Never cat a whole file or dump a full tree into stdout — the transcript
    rides your context forever, and a program that prints 150k characters
    pushed this seat's prompt to 128k tokens in one recorded run, where every
    later call crawled. List file NAMES with sizes, then read only the one
  file you actually need, in slices (sed -n '1,80p'). Recon is done in ONE
  program; after it you author.
  - AUTHOR BY ITERATION 4. Measured 2026-10-19 (bfs9): seven recon rounds
    into tools.ts/discipline.ts/parity suites and the slice died at the
    safety ceiling BEFORE the publish program was ever written — the seat
    knows the tool surface from the menu already, and every extra read
    round-trip costs 4-90s of gateway time. Your instruction text does not
    need line-level quotes from the sources; it needs the RIGHT FILE NAMES
    and the RIGHT INVARIANT NAMES. One recon program (round 1-2), at most
    ONE follow-up read (round 3), then WRITE the wave. A reply with no JSON
    action burns a whole round-trip — every non-PLAN turn must carry either
    a program or the publish action.
  - WAVE SHAPE: publish AT MOST 1 project in this wave, and make it the
    SIMPLEST possible change: ONE source file plus ONE test, inside ONE
    package directory of this repository.  The package is NOT your choice:
    the SPREAD GATE decides it.  The gate names the directories that are
    BANNED for this wave and the COLD directories that no merged wave has
    touched yet, and the gate's list wins over the TARGET MENU below.  When
    the gate names no cold directory (no merged wave yet), take one target
    from the menu and still keep the whole project inside the ONE package
    directory that target names.  Keep the change checkable by the offline
    gate alone: the wave host runs browserless by policy, so a project that
    needs a rendered frame is not a project this wave can carry.
    Prefer, INSIDE THAT ONE PACKAGE, a change to WORDING, MESSAGES, NAMING
    or DOCUMENTATION over a change to validation logic, schemas or control
    flow: the Actor seat
    implements it, and a message-shaped edit lands in one program while a
    schema edit needs a long reasoning chain (measured 2026-10-19: the
    schema-hardening project needed 9-12k reasoning tokens per call and the
    message-shaped one needed a fraction of that).
    Measured 2026-10-19 (bfs10): a 6-project wave at 2-way parallelism needs
    3 rounds of Actor seats (3 x 700s) and cannot fit any run ceiling; and
    wide projects never reach a green gate inside one Actor slice.  A narrow
    wave with one small project is what the budget can actually carry to a
    merge.
  - Author from the TARGET MENU below. Do NOT sweep the repository first:
    measured 2026-10-19 (bfs5): an unrestricted Curriculum reached iteration
    14 with a 74k token context and never published a wave; measured again
    (bfs9): seven recon rounds died at the ceiling before authoring. Pick a
    target, read THAT file once, and author.
  - After you stage a project's fixture tree, the harness extracts a
    committed snapshot of a real multilingual video production-line
    repository OVER your staged files, and the repository's copy wins any
    collision: a staged copy of an existing file would be replaced by the
    repository's own bytes. Stage only the task-specific fixtures your
    instruction needs (sample inputs, blank workspaces); never try to
    reconstruct the codebase - it is already on the Actor's machine.
  - The Actor therefore starts from the real repository plus your fixtures
  at /home/user/evolution_project. Author instructions that treat the
  existing code as the working material.
  - Every candidate must keep the repository's offline verification gate
    green: "pnpm verify" (from the project root, after a one-time "pnpm
    install") must exit 0. Tell the Actor in each instruction to run that
    gate as its own final check before declaring done.
  - Live platform publishing and platform login never run in this
    environment: instructions must ask for offline artifacts only (code,
    data, fixtures, reports), never for a live publish or login.
  - Improvements may target the pipeline itself or the repository's
    AI-operator tool surface (the dsh plugin package, plus the howtos
    under skills/ that teach it): tool naming, request shapes, refusal
    and approval wording, discipline defaults, and the suites that pin
    them are all ordinary tracked sources. An instruction may name
    those files as the working material and ask for offline-verifiable
    edits there; it must also demand the guard rails stay intact -
    approval-gated tools keep failing closed when approval is absent,
    publishing stays out of reach by default, and red-line suites may
    be extended but never relaxed.

  TARGET MENU (measured sizes; read only what you name).  The SPREAD GATE
  above decides which of these you may use in this wave; this menu is the
  catalogue, not the permission:
  A. packages/dsh-plugin/src/tools.ts (22 KB) - the tool surface: one tool
     per pipeline capability. Naming, argument shapes, error text.  Its
     neighbours in the same directory are the pieces the tool surface was
     split into: gate.ts (2.3 KB, the approval gate at the dispatch layer),
     video.ts (6.4 KB, the video line's mechanical contract - the single
     source for what a submit costs and what the approval card says),
     capture.ts (4.3 KB), result.ts (4.0 KB), toolnames.ts (1.2 KB).  Name
     ONE of them, not the lot.
  B. packages/dsh-plugin/src/index.ts (7.3 KB) + discipline.ts (2.8 KB) -
     the red-line carriers: publish unreachable by default, the system-prompt
     discipline section.
  C. packages/dsh-plugin/test/plugin-parity.test.ts (22 KB) - the pinning
     suite that keeps A and B honest. Extending it is a valid project.
  D. packages/dsh-plugin/test/plugin.test.ts (25 KB) - behavioural tests
     for the built dist bundle.
  E. skills/<name>/SKILL.md (12 skills, e.g. video-generation, publish-copy,
     bgm-bed) - the operator howtos that teach the same surface.
  F. packages/core/src (31 files, 544 KB) - the real pipeline. EXPENSIVE:
     name one module (scene parsing, timeline math, audio composition,
     manifest building) and read only that.
  G. tools/foodnames/ (the 'food names in twelve languages' series line) -
     the only CONTENT line in the repo that ships finished episodes
     (12 delivered, 12 locales each).  Its parts:
       G1. build_episode.mjs (~360 lines) - the data -> scene generator.
           It emits poster_src.html / video_src.html / voices.json / fonts.json.
       G2. templates/video_style.css (117 lines) - the video scene layout.
       G3. templates/video_script.js (34 lines) - the fit + karaoke state
           machine that runs in the page.
       G4. templates/poster_style.css (152 lines) - the POSTER layout, which
           is the in-repo reference implementation of what a good scene looks
           like (there the word IS the hero).
       G5. tools/foodnames/check_sentence_matches.mjs - the offline gate for
           the defect below (it is the acceptance criterion; do NOT edit it).
  Guard rails for every target: approval-gated tools keep failing closed,
  publish stays unreachable unless config.publish === true, red-line suites
  may be extended but never relaxed.

  WAVE BRIEF (2026-10-21, measured on the 12 delivered episodes) - the target
  area for THIS wave is G.  Read it as the curriculum's own finding: the
  'food names' video line ships 12 finished episodes and every one of them has
  the same five visible defects.  The numbers below are measurements, not
  opinions; they come from the two gates in tools/foodnames/.

  **DO NOT RECON.  Author this wave now.**  Everything you need is in this
  brief: the target directory, the file names, the defects, the measured
  numbers, the acceptance command.  The first program you write should be the
  one that publishes the wave.  (2026-10-21 measured: the wave before this one
  spent its whole curriculum slice on two recon programs - 207s for the first
  response, 74s for the second - and died at the 280s slice having authored
  nothing.  A recon round here buys nothing: the files are named below.)

  D1  THE SENTENCE ON SCREEN IS NOT THE SENTENCE IN THE AUDIO  (worst).
      build_episode.mjs replaces the FIRST token of every sentence with the
      word form, so that the food name can be coloured.  Whenever the first
      token is not exactly the word form, that token is EATEN - and if the
      word also occurs later in the sentence, it is DUPLICATED:
        fr-FR  screen "sushi sushi est un plat japonais"  audio "Le sushi est un plat japonais"
        es-ES  screen "sushi sushi es un plato japones"   audio "El sushi es un plato japones"
        el-GR  screen "sushisushi einai iapwniko piato"    audio "To sushi einai iapwniko piato"
        ja-JP  screen "cha-cha ha ... kita"                audio "cha wa ... kita"   (the topic
               particle is lost with the token)
        ko-KR  screen "cha Jung-gu seo wa-yeot-seo-yo"     audio "cha-neun ..."      (same)
      Measured: 54 of the 144 locale-episode combinations are affected (37%).
      Two consequences, both fatal: (a) the karaoke highlight is off by one
      word for the whole sentence - the audio says "Le" while the screen
      lights up "sushi"; (b) the sentence the viewer reads is ungrammatical.
      The existing verify-sync gate does NOT catch it: it counts words, it
      does not compare them.
      FIX DIRECTION: give the word its colour on the token that really is the
      word; never change the token sequence itself.
      ACCEPTANCE (offline, zero browser, the gate must exit 0):
        node --import tsx tools/foodnames/check_sentence_matches.mjs --all

  D2  THE FOOD NAME IS NOT THE HERO OF THE VIDEO.  The scene's stage holds
      the whole sentence and the name is only its first token, so a series
      called 'food names in twelve languages' never shows the name.
      Measured (portrait 1080x1920): the name's ink is 4.5%-13.3% of the
      frame height.  The poster gets this right (the name is the hero there);
      the video does not.  Criterion: the name must be an element of its own
      and take at least 12% of the frame height (or 30% of its width, for
      long words that are width-bound).

  D3  THE FRAME IS MOSTLY EMPTY.  Measured: the largest empty horizontal
      band is 26%-30% of the frame height (top and bottom of the portrait
      frame).  Criterion: at most 15%.

  D4  THE WORDS YOU HAVE NOT REACHED YET ARE INVISIBLE.  .tok.dim is
      opacity 0.18.  Criterion: at least 0.45.

  D5  THE HIGHLIGHT IS A NEUTRAL GREY, NOT ONE OF THE THREE BRAND COLOURS.
      Measured: rgba(44, 38, 32, 0.09).  The footer's own legend promises
      exactly three colours (vowel #c9403a, consonant #2f5d9e, tone #b8860b).
      Criterion: the current token's highlight must be one of those three.

  The gates that measure D2-D5 are in tools/foodnames/check_video_layout.mjs.
  They need a RENDERED episode, which the guest does not have (usine/examples/
  is not tracked), so D2-D5 are verified after the merge by whoever owns the
  workspace; D1 is the gate the Actor can and must run itself.  Say this
  split explicitly in the instruction you author - an instruction that claims
  all five are checkable in the guest teaches the Actor to look for a gate
  that is not there, and it will burn its slice proving that.

  PUT THESE THREE BOUNDS IN THE INSTRUCTION YOU AUTHOR (they are not
  suggestions, they are the difference between a wave that lands and a wave
  that dies at the emergency ceiling):

  1. **NO SELF-BUILT RENDERER.**  Tell the Actor, verbatim: do NOT build a
     renderer, a driver script, or a headless-Chrome pipeline to check D2-D5.
     Measured 2026-10-21 (foodnames-video4): the Actor spent its last six
     iterations on exactly that (144s wiring Chrome, 39s patching a --formats
     flag), hit the emergency ceiling with the work unpublished, and the wave
     produced ZERO.  The guest has no browser and no rendered episode; D2-D5
     are checked by the workspace owner after the merge.  The Actor's job is to
     make the CSS/markup MEET THE NUMBERS printed above and to state, in its
     report, which number each change satisfies.
  2. **BOUND THE GATE RUNS.**  `check_sentence_matches.mjs --all` at most TWICE
     (once before editing, once after); `pnpm verify` at most ONCE.  Re-running
     the same gate is not new evidence - measured 2026-10-21: one gate run
     took 94s, another 158s, on a machine that was already busy, and four such
     runs ate a third of the Actor slice.
  3. **BOUND THE DELIVERABLES.**  At most THREE files change under
     tools/foodnames/: the builder, the stylesheet, and ONE test file.  If a
     fix seems to need a fourth, report it as a follow-up instead of opening
     it - an unbounded deliverable list is what turns one slice into no slice.

  WAVE SHAPE FOR THIS TARGET: one source file plus one test, both under
  tools/foodnames/ (that is the ONE directory this project may touch).  The
  scene's markup lives in build_episode.mjs and its look lives in
  templates/video_style.css; the fit and the karaoke state machine live in
  templates/video_script.js.  A change that only rewrites the CSS cannot fix
  D1, and a change that only rewrites the builder cannot fix D4/D5 - so one
  project that touches build_episode.mjs AND templates/video_style.css is
  the natural shape.  Keep the 12 data files (tools/foodnames/data/*.json)
  untouched: they are the content, and the gates compare against them.
