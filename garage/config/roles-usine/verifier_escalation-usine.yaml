# Persistent fuyao-coding Verifier Agent for an escalated segment.
#
# Full asymmetry is invariant (the stock GLM/K3 pairing, reseated):
#   main:      fuyao-coding Actor <-> fuyao-work Verifier
#   escalated: fuyao-work Actor <-> fuyao-coding Verifier
#
# The escalated verifier reads images natively here (vision_model ""); there is
# no second eye, witness ensemble, or ensemble judge.
model: fuyao-coding
provider_order: []
provider_allow_fallbacks: true
provider_require_parameters: true
max_tokens: 65536
temperature: 1.0
primary_temperature: 1.0
top_p: 1.0
reasoning_effort: "max"
reasoning_max_tokens: 0
reasoning_in_history: true

agent_decided_stop: true
max_iters: 120
# Inert in v2; retained for already-loaded v1 Verifier compatibility.
max_nudges: 25
wall_clock_secs: 280
llm_infra_retry_secs: 30
script_timeout: 600
controller_recovery_secs: 180
controller_recovery_probe_secs: 5.0
controller_recovery_stable_probes: 2
max_resumes: 0
escalation_model: ""
action_discipline: true
cycle_evidence: true

# Preserve this Verifier Agent's complete context within the escalated segment.
# The main Flash Verifier's private history is deliberately not imported.
# 2026-10-19: explicit folding bounds added.  The engine's transport follows
# the control seat's high/low watermarks, but the config must be able to
# state its own intent; an escalated segment that outgrows the provider
# window is the same HTTP 400 that ended wave1r.
history_keep_pairs: 80
keep_chars: 500000
ctx_high_water: 250000
ctx_low_water: 150000
# Bounded trace for the same reason as the main Verifier seat: an unbounded
# trace leaves the fold nowhere to land.
trace_head: 0
trace_tail: 20000

# Native sight: one Look has one reading and no ensemble judge.
vision_model: ""
vision_rounds: 1
look_ensemble: 1
vision_max_tokens: 32768
look_max_side: 2560
archive_eyes: false
vision_model_2: ""

# The outer Actor Agent <-> Verifier Agent harness owns verification.
practice_mode: true
independent_verify: false
verifier_model: ""
