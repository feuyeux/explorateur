# Persistent, full-authority Verifier Agent for the usine Phase-1 baseline.
# One Verifier Agent context is retained across FAIL -> Actor repair -> re-verification
# and across Actor resume segments for the same task. It freely chooses programs,
# looks, evidence depth, and when its report is ready.
#
# usine seat: fuyao-work with NATIVE vision (vision_model "");
# the model reads pixels itself. No provider pins: the endpoints file routes
# the slug to its own gateway.
model: fuyao-work
max_tokens: 65536
temperature: 0.0
primary_temperature: 1.0
top_p: 1.0
# 2026-10-19 (bfs15 postmortem): the Verifier seat is the ONLY hard gate of the
# whole pipeline, and it died there on a WALL CLOCK, not on a judgment: bfs13
# burned its whole 280s slice on 19 real probes and was killed by
# `safety_ceiling` (core/loop.py: the emergency wall ceiling reached before the
# agent published), with the report never written.  bfs12 died the same way at
# iteration 31 while its own probes already showed every test passing.
#
# The probes are shell commands and file greps; max reasoning is pure latency
# on them.  The same A/B probe that moved the Actor seat to "low" (5x faster on
# the same bytes, output quality unchanged) applies here, and a wrong verdict
# is structurally contained: wave_merge re-runs the real gate ("pnpm verify")
# before it commits a candidate, so a false PASS cannot reach the usine tree
# un-gated.  A false FAIL only costs the merge, never the memory.
reasoning_effort: "low"
reasoning_max_tokens: 0
reasoning_in_history: true

agent_decided_stop: true
# Emergency watchdog, not a semantic criterion.  2026-10-19: tightened to the
# Verifier slice of the 600s run ceiling (time_budget.DEFAULT_SLICES) so a
# verification segment cannot hold the wave past its boundary.
max_iters: 120
# Inert in v2; retained for already-loaded v1 Verifier compatibility.
max_nudges: 25
# 2026-10-19 (bfs13 postmortem): 280s was too thin for the one seat that has
# to finish an investigation AND write a report.  bfs13 spent all 280s on
# 19 probes and was killed at the wall with nothing published; the same run
# shows the seat one turn away from its closing cross-check.  420s buys the
# same seat the room to conclude, and the run ceiling still holds because
# time_budget.DEFAULT_SLICES was re-balanced around it (the Actor slice lost
# 160s that the low-effort switch no longer needs).
#
# 2026-10-20: raised to 500s for the same reason as the Actor seat — a
# slice is a CEILING and never loosens a seat's own declared wall, so a
# declared 420s silently clamped a larger DRS verifier slice back down.
# Phase 1 is unaffected (its own slice is 420s).
wall_clock_secs: 500
llm_infra_retry_secs: 30
script_timeout: 600
controller_recovery_secs: 180
controller_recovery_probe_secs: 5.0
controller_recovery_stable_probes: 2
max_resumes: 0
escalation_model: ""
action_discipline: true
cycle_evidence: true

# Preserve the complete Verifier Agent conversation and program output.
# 2026-10-19: explicit folding bounds added — a Verifier that outgrows the
# provider window is the same HTTP 400 that ended wave1r, and this seat is
# the one that accumulates the most evidence per segment.
history_keep_pairs: 80
keep_chars: 500000
ctx_high_water: 250000
ctx_low_water: 150000
# Bounded trace: the original 0/0 meant "keep the whole conversation", which
# cannot coexist with folding above — an unbounded trace has nowhere to fold
# TO.  The Verifier still sees its findings and verdicts (history_keep_pairs
# keeps 80 recent pairs, keep_chars caps the folded bulk).
trace_head: 0
trace_tail: 20000

# Native sight: one Look has one reading and no ensemble judge.
vision_model: ""
vision_rounds: 1
look_ensemble: 1
vision_max_tokens: 32768
look_max_side: 2560
archive_eyes: false
vision_model_2: ""

# The outer Actor Agent <-> Verifier Agent harness owns correctness verification.
# These fields prevent recursive verification inside the Verifier Agent runtime.
practice_mode: true
independent_verify: false
verifier_model: ""
