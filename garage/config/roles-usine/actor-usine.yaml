# Unified-loop ACTOR AGENT for usine practice projects.
#
# Same seat contract as the stock practice actor: the practice Actor learns
# durable memory with the same identity that must transfer it back. Numeric
# limits are emergency watchdogs, not semantic stopping criteria.
#
# usine seats: fuyao-coding (2026-10-18 lineup switch; M3 actor thrashed —
# 220 iters + one 570s timeout with 25MB stdout). This seat runs text-only
# (vision_model ""); the model itself sees natively (user-confirmed
# 2026-10-19) - it also seats the Curriculum's delegated eye and the
# escalated verifier.
# RSIAGENT_LLM_ENDPOINTS_FILE routes every slug to its own gateway, and an
# OpenRouter provider pin would be a foreign request field there.
model: fuyao-coding
provider_order: []
provider_allow_fallbacks: true
provider_require_parameters: true
vision_model: ""
vision_rounds: 1
look_ensemble: 1
look_ensemble_temp: 0.8
split_done_gate: true
max_tokens: 65536
# "low", not "max": measured 2026-10-19 on the REAL heavy-context Actor
# turn (probe_actor_effort.py --last-turn, 29801 prompt tokens, same bytes
# for every arm):
#     effort  secs  completion  reasoning_tokens
#     none     99.3      14197            12768   <- "disable thinking" is
#                                                         IGNORED by this
#                                                         gateway: it thinks
#                                                         anyway, the slowest
#                                                         arm
#     low       6.4        840              489   <- 5x faster than max
#     max      33.8       5080             3960
# So the effort knob IS honored here (the engine's "M3 ignores effort" note
# does not apply to this gateway) and the ordering is low < max < none —
# the opposite of the intuition that less effort means less thinking.
# Two full low-arm samples produced COMPLETE, careful edit programs (anchor
# assertions, exact replacement blocks), so the speed does not cost quality
# on this seat's real task.  Same-effort variance is still large (6.4s to
# 72s), so the slice keeps its margin.
reasoning_effort: "low"
reasoning_max_tokens: 0
reasoning_in_history: true
temperature: 1.0
primary_temperature: 1.0
top_p: 1.0
agent_decided_stop: true
# Emergency watchdogs, not semantic stopping criteria.  2026-10-19: these
# were 2000 iters / 86400s; tightened to the Actor slice of the 600s run
# ceiling (time_budget.DEFAULT_SLICES) so a branch self-terminates instead of
# holding the whole run.  Sizing is measured: the fuyao gateway has returned
# single round trips above 120s under retry (bfs-20261019), so 240s leaves
# room for a worst-case answer plus the work that follows it.
max_iters: 120
max_nudges: 25
# 2026-10-20: this value was 780s and it silently clamped the DRS plan's
# 900s Actor slice back to 780s — a slice is a CEILING and never loosens a
# seat's own declared wall, so the DRS Actor seat ran on 780s anyway (caught
# by smoke_time_budget's "every plan slice is actually effective" check
# before the next run, not by a 35-minute run).  950s so the DRS plan's
# 900s slice is the binding constraint; Phase 1 is unaffected (its own slice
# is 580s, so apply_slices clamps this seat back down to 580s).
wall_clock_secs: 950
history_keep_pairs: 80
keep_chars: 500000
verifier_model: ""
ctx_high_water: 250000
ctx_low_water: 150000
doubts_block_pass: true
look_max_side: 2560
archive_eyes: false
vision_model_2: ""
vision_max_tokens: 32768
practice_mode: true
independent_verify: false
escalation_model: ""
max_resumes: 0
action_discipline: true
cycle_evidence: true
commit_frac: 1.0
system_extra: |
  USINE PRODUCTION-LINE CONTEXT (governs every project you execute):
  - PLAN LINE + ACTION, IN THE SAME REPLY.  The opening instruction tells you
    to begin with one line "PLAN: <your phases>" and THEN give your program.
    Measured 2026-10-19 (bfs11): the model wrote the PLAN line and then
    stopped, in 14 of 29 turns.  A plan-only reply performs NOTHING, gets
    nudged, and burns a whole round trip — a third of this seat's wall
    clock went to empty turns.  Write the PLAN as ONE short line and put
    the action object in the SAME reply, always.  Never end a reply without
    the action object; a reply is a program, a look, or a done-declaration.
  - EDIT BY ITERATION 5.  Recon in at most TWO programs: one that lists the
    file names and sizes you need, one that prints the bounded excerpts of
    the files you will edit.  Measured (bfs11): 11 recon turns preceded the
    first edit, and the seat ran out of wall clock at the SECOND verify
    run with the edits already in place.  The instruction tells you which
    files to work on — read those and start editing.
  - OUTPUT BUDGET: each of your programs must print LESS THAN 8000
    characters.  A program that dumps a whole file or a full test log into
    stdout pushed this seat's prompt to 57k tokens in one recorded run
    (bfs10), where every later call crawled into the gateway's timeout tail
    and the slice died on retries.  Tail the output (tail -40, grep for the
    failing lines); re-run a narrow probe when you need detail.
  - GATE DISCIPLINE: `pnpm install` once (own program), then `pnpm verify`
    (own program, ~35s).  Do not run verify speculatively — run it after a
    change, and use the failure lines to drive the next edit.  The offline
    gate must exit 0 before you declare done.  Browser-gated suites are
    skipped on this host by design (FEUILLE_BROWSER sentinel); SKIP is not
    PASS, do not count them as coverage.
  - SUBMIT INSIDE YOUR BUDGET: this seat runs on a bounded wall-clock budget,
    and if that budget expires before you publish your submission, the harness
    records NOTHING — the edits, the green gate and the probes you already ran
    are all discarded.  Work in this order: (1) the required code change,
    (2) the gate run that proves it, (3) the required deliverable, (4) optional
    commentary.  When the requirement is met, publish the submission (the
    handoff line "STATUS: SUBMIT") rather than polishing the prose.  A shorter
    report beats an unfinished run; a run that never submits is worth nothing.
    Measured 2026-10-20 (bfs16 DRS): the seat was killed by its 580s wall
    clock while writing the final markdown report — the code change was done,
    the full gate was green (531 passed / 8 skipped) and 6 new pin tests were
    executing.  One iteration of report-writing was all that separated it from
    the submission.
