# Unified-loop ACTOR AGENT for usine practice projects.
#
# Same seat contract as the stock practice actor: the practice Actor learns
# durable memory with the same identity that must transfer it back. Numeric
# limits are emergency watchdogs, not semantic stopping criteria.
#
# usine seats: fuyao-coding (2026-10-18 lineup switch; M3 actor thrashed —
# 220 iters + one 570s timeout with 25MB stdout). This seat runs text-only
# (vision_model ""); the model itself sees natively (user-confirmed
# 2026-10-19) - it also seats the Curriculum's delegated eye and the
# escalated verifier.
# RSIAGENT_LLM_ENDPOINTS_FILE routes every slug to its own gateway, and an
# OpenRouter provider pin would be a foreign request field there.
model: fuyao-coding
provider_order: []
provider_allow_fallbacks: true
provider_require_parameters: true
vision_model: ""
vision_rounds: 1
look_ensemble: 1
look_ensemble_temp: 0.8
split_done_gate: true
max_tokens: 65536
reasoning_effort: "max"
reasoning_max_tokens: 0
reasoning_in_history: true
temperature: 1.0
primary_temperature: 1.0
top_p: 1.0
agent_decided_stop: true
# Emergency watchdogs, not semantic stopping criteria.  2026-10-19: these
# were 2000 iters / 86400s; tightened to the Actor slice of the 600s run
# ceiling (time_budget.DEFAULT_SLICES) so a branch self-terminates instead of
# holding the whole run.  Sizing is measured: the fuyao gateway has returned
# single round trips above 120s under retry (bfs-20261019), so 240s leaves
# room for a worst-case answer plus the work that follows it.
max_iters: 120
max_nudges: 25
wall_clock_secs: 500
history_keep_pairs: 80
keep_chars: 500000
verifier_model: ""
ctx_high_water: 250000
ctx_low_water: 150000
doubts_block_pass: true
look_max_side: 2560
archive_eyes: false
vision_model_2: ""
vision_max_tokens: 32768
practice_mode: true
independent_verify: false
escalation_model: ""
max_resumes: 0
action_discipline: true
cycle_evidence: true
commit_frac: 1.0
