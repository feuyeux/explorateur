:root { --paper:#f7f2e6; --ink:#2c2620; --gold:#b8860b; --mut:#a2967f; --sub:#8a7e6c; --line:#d9cdb7; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1440px; overflow:hidden; }
body { background:var(--paper); color:var(--ink); font-family:"Food West","Noto Sans",sans-serif; padding:56px 64px; display:flex; flex-direction:column; }
.f-sc { font-family:"Food SC","Noto Serif SC",serif; }
.f-kr { font-family:"Food KR","Noto Sans KR",sans-serif; }
.title { font-size:72px; font-weight:600; color:var(--gold); letter-spacing:0.04em; }
.brand { margin-top:18px; font-size:22px; letter-spacing:0.14em; color:var(--sub); }
.mid { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.old { font-size:88px; color:var(--mut); text-decoration:line-through; text-decoration-thickness:5px; }
.big { font-size:300px; line-height:1.25; color:var(--gold); }
.gloss { margin-top:8px; font-size:54px; color:var(--ink); }
.foot { border-top:1.5px solid var(--line); padding-top:20px; display:flex; justify-content:space-between; font-size:26px; color:var(--sub); }
