[project]
name = "usine"
version = "0.1.0"
description = "多语种教学视频渲染管线：人物亮相卡 + A/B 对话教学场景（Pillow 渲染 + edge-tts 配音 + Edge headless 文字层）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 版本对齐原双解释器环境并锁定：Pillow 12.3.0 = 渲染像素基线（framehash 幂等的保证），
# edge-tts 7.2.8 = 词级时间戳口径；升级前必须重验 framehash 基线。
dependencies = [
    "edge-tts==7.2.8",
    "pillow==12.3.0",
    "numpy==2.3.5",
]

[dependency-groups]
# 抖音发布工具（scripts/*.py）专用，不进主环境：uv sync --group douyin 后还需 playwright install chromium
douyin = ["playwright>=1.40"]

[project.scripts]
usine = "usine.cli:main"                      # 统一入口：usine <组> <命令>（下面这些是它的等价别名，全部保留）
usine-cards = "usine.intro_cards:main"          # 亮相卡管线：tts / assets / render
usine-chars = "usine.char_sheet:main"           # 人物形象体检台：28 人立绘大图 / 总览 / 索引页
usine-parse = "usine.parse_scene:main"          # lessons/<id>/scene.md -> lessons/<id>/scene.json
usine-scene = "usine.scene_video:main"          # 教学场景管线：tts / assets / render / list
usine-lesson = "usine.build_lesson:main"        # lessons/<id>/scene.json + analysis -> 教学文档 HTML
usine-dump-lesson = "usine.dump_lesson_source:main"  # lessons/<id>/scene.json -> 逐语种解析源文本
usine-validate = "usine.scene_schema:main"           # 场景数据前置校验（parse 与 render 之间）
usine-draft = "usine.scene_draft:main"                # lessons/<id>/brief.json -> scene.md 结构草稿
usine-ledger = "usine.ledger:main"                   # 产物缓存账本 build/manifest.json（status 看谁过期了）
usine-publish = "usine.publish:main"                 # 发布台账 publish/ledger.json + 指标回流分析（P2-5）

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usine"]
