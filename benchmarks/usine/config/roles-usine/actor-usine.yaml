# Unified-loop ACTOR AGENT for usine practice projects.
#
# Same seat contract as the stock practice actor: the practice Actor learns
# durable memory with the same identity that must transfer it back. Numeric
# limits are emergency watchdogs, not semantic stopping criteria.
#
# usine seats: fuyao-coding (2026-10-18 lineup switch; M3 actor thrashed —
# 220 iters + one 570s timeout with 25MB stdout). Text-only seat, no vision.
# RSIAGENT_LLM_ENDPOINTS_FILE routes every slug to its own gateway, and an
# OpenRouter provider pin would be a foreign request field there.
